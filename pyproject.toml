[project]
name = "recollect"
version = "0.1.0"
description = "A deployable harness for episodic conversational memory, instrumented so every retrieval decision is visible."
requires-python = ">=3.13"
# Proprietary, source-available. Not open source, and not publishable to PyPI.
# LICENSE carries the grant; THIRD_PARTY_NOTICES.md covers the separately
# licensed components, including why a proprietary product may build on
# `episodic` when that library is published under the AGPL.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "episodic",
    "numpy>=2.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "trafilatura>=2.2.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
# The pinned embedder loads the carried GGUF through llama.cpp in-process.
# The wheel is part of the identity, not just the version - see docs/EMBEDDER.md.
llama = ["llama-cpp-python==0.3.25"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
recollect = "recollect.cli:main"
recollect-research-mcp = "recollect.engine.mcp_research:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recollect"]

[tool.uv.sources]
# The mechanism library is developed in the research repository and consumed
# here unmodified. Recollect never forks it: the shadow-trace engine
# reproduces its output byte-for-byte instead, so any drift is loud.
episodic = { path = "../contextDecayWindow/episodic", editable = true }

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. That is exactly how
# FastAPI declares request bodies and dependencies, so it is not a finding
# here - it is the framework's calling convention.
"src/recollect/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: opt-in tests that require the pinned local sandbox image",
]
